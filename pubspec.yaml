name: anotty
description: Gestão financeira para profissionais autônomos.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Banco de dados
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Internacionalização
  intl: ^0.20.2

  # Utilidades
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  file_picker: ^10.3.2

  # Notificações
  flutter_local_notifications: ^19.4.1

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Compartilhamento
  share_plus: ^11.0.0

  # Formatação
  flutter_multi_formatter: ^2.13.9

  # Monetização
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false

  image_path: assets/images/app_icon.png

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png